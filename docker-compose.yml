version: "3.9"

services:
  # ── Backend API + WebSocket ──────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: svs-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      SVS_DATABASE_URL: "sqlite+aiosqlite:///./data/subvision.db"
      SVS_DEBUG: "false"
      SVS_EXTERNAL_API_URL: "${EXTERNAL_API_URL:-http://host.docker.internal:9000/api}"
      SVS_EXTERNAL_API_TOKEN_URL: "${EXTERNAL_API_TOKEN_URL:-http://host.docker.internal:9000/api/token}"
      SVS_OBS_WEBSOCKET_URL: "${OBS_WS_URL:-ws://host.docker.internal:4455}"
      SVS_OBS_WEBSOCKET_PASSWORD: "${OBS_PASSWORD:-}"
      SVS_CORS_ORIGINS: "http://localhost,http://localhost:80,http://localhost:4200"
    volumes:
      - svs-data:/app/data
      - svs-hls:/app/hls
      - svs-configs:/app/configs
    networks:
      - svs-net
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # ── Frontend (Angular → nginx) ───────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: svs-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - svs-net

  # ── MediaMTX — RTSP relay + WebRTC bridge ─────────────────────────────────
  mediamtx:
    image: bluenviron/mediamtx:latest
    container_name: svs-mediamtx
    restart: unless-stopped
    ports:
      - "8554:8554"   # RTSP
      - "8889:8889"   # WebRTC
      - "8888:8888"   # HLS
    networks:
      - svs-net

volumes:
  svs-data:
  svs-hls:
  svs-configs:

networks:
  svs-net:
    driver: bridge
